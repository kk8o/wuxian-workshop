name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[ui,mcp,test]"
      - name: Tests
        env:
          WUXIAN_HEADLESS: "1"
        run: python -m unittest discover -s tests -t .
